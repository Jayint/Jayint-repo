name: Valkey Test
jobs:
  valkey-test:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
